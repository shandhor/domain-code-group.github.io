<div [attr.dir]="isArabic() ? 'rtl' : 'ltr'" class="font-cairo bg-[#0a0e17] text-white min-h-screen">

  <!-- Language toggle (matches ERP page pattern) -->
  <button (click)="toggleLang()" class="fixed top-14 left-6 z-[110] glass px-4 py-2 rounded-full text-xs font-bold border border-white/20 hover:gradient-bg transition-all">
    {{ isArabic() ? 'English' : 'العربية' }}
  </button>

  <!-- Header -->
  <header class="relative pt-24 pb-16 px-6 text-center overflow-hidden border-b border-white/5">
    <div class="animate-float absolute top-0 left-1/2 -translate-x-1/2 w-full h-[400px] gradient-bg opacity-5 blur-[120px] rounded-full"></div>
    <div class="relative z-10 max-w-3xl mx-auto">
      <div class="inline-block px-4 py-1 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-400 text-xs font-bold uppercase tracking-widest mb-6">
        <i class="fas fa-question-circle mr-2 ml-2"></i>
        {{ t().badge }}
      </div>
      <h1 class="text-4xl md:text-6xl font-black mb-6 leading-tight italic">
        {{ t().title }}
        <span class="gradient-text">{{ t().highlight }}</span>
      </h1>
      <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed">
        {{ t().subtitle }}
      </p>
    </div>
  </header>

  <!-- FAQ List -->
  <section class="max-w-4xl mx-auto py-16 px-6">
    <div class="space-y-4">
      <div
        *ngFor="let faq of faqs; let i = index"
        class="glass rounded-2xl border border-white/5 overflow-hidden transition-all"
        [class.border-blue-500]="openIndex() === i">
        <button
          type="button"
          (click)="toggleFaq(i)"
          [attr.aria-expanded]="openIndex() === i"
          class="w-full flex items-center justify-between gap-4 p-6 text-start font-bold text-base md:text-lg hover:bg-white/[0.02] transition-colors">
          <span class="flex-1">{{ isArabic() ? faq.questionAr : faq.questionEn }}</span>
          <span class="w-8 h-8 flex items-center justify-center rounded-full gradient-bg text-white flex-shrink-0 transition-transform"
                [class.rotate-45]="openIndex() === i">
            <i class="fas fa-plus text-xs"></i>
          </span>
        </button>
        <div *ngIf="openIndex() === i" class="faq-answer px-6 pb-6 text-gray-300 leading-relaxed border-t border-white/5 pt-4">
          {{ isArabic() ? faq.answerAr : faq.answerEn }}
        </div>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="max-w-3xl mx-auto px-6 pb-24">
    <div class="glass rounded-[2.5rem] p-8 md:p-12 text-center border border-blue-500/20 relative overflow-hidden">
      <div class="absolute -inset-4 gradient-bg opacity-5 blur-3xl rounded-full"></div>
      <div class="relative z-10">
        <h3 class="text-2xl md:text-3xl font-black mb-4 italic">
          <span class="gradient-text">{{ t().ctaTitle }}</span>
        </h3>
        <p class="text-gray-400 mb-8 text-lg font-light">{{ t().ctaDesc }}</p>
        <a
          href="https://wa.me/966561316069"
          target="_blank"
          rel="noopener"
          class="inline-flex items-center gap-3 gradient-bg px-8 py-4 rounded-full font-bold text-lg hover:opacity-90 transition shadow-xl">
          <i class="fab fa-whatsapp text-xl"></i>
          <span>{{ t().ctaButton }}</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer link back home -->
  <footer class="py-8 px-6 border-t border-white/5 text-center">
    <a routerLink="/" class="text-sm text-gray-500 hover:text-blue-400 transition">
      <i class="fas" [class.fa-arrow-left]="!isArabic()" [class.fa-arrow-right]="isArabic()"></i>
      <span class="mx-2">{{ isArabic() ? 'العودة للرئيسية' : 'Back to Home' }}</span>
    </a>
  </footer>
</div>
