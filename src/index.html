  <base href="/">
  <script>
    // Legacy hash URL redirect: /#/foo → /foo (protects bookmarks from the GitHub Pages hash era)
    (function () {
      var h = window.location.hash;
      if (h && h.charAt(0) === '#' && h.charAt(1) === '/') {
        window.location.replace(h.substring(1) + window.location.search);
      }
    })();
  </script>
